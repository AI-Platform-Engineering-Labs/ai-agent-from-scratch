# Mounts Key Vault secrets as files under /mnt/secrets using workload identity.
# No Kubernetes Secret object is created, so values are not stored in etcd.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: agent-secrets
  namespace: agent
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "${AGENT_IDENTITY_CLIENT_ID}"
    keyvaultName: "${KEY_VAULT_NAME}"
    tenantId: "${TENANT_ID}"
    objects: |
      array:
        - |
          objectName: anthropic-api-key
          objectType: secret
        - |
          objectName: agent-api-token
          objectType: secret
