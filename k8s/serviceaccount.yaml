apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-sa
  namespace: agent
  annotations:
    # Client ID of the user-assigned identity created by Terraform (output: agent_identity_client_id)
    azure.workload.identity/client-id: "${AGENT_IDENTITY_CLIENT_ID}"
    azure.workload.identity/tenant-id: "${TENANT_ID}"
